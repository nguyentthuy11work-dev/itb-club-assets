openapi: 3.1.0
info:
  title: AMS API v1 examples
  version: 1.0.0-draft
  description: Phase-0 API contract freeze. Every operation has one success and one rejection example.
servers: [{ url: /api/v1 }]
paths:
  /auth/login:
    post: { operationId: login, x-happy-response: '{"accessToken":"eyJ...","user":{"id":"uuid","roles":["HR"]}}', x-error-response: '{"error":{"code":"INVALID_CREDENTIALS","message":"Username or password is invalid.","details":{}},"traceId":"uuid"}', responses: { '200': { description: authenticated }, '401': { description: invalid credentials } } }
  /auth/refresh:
    post: { operationId: refreshSession, x-happy-response: '{"accessToken":"eyJ...","expiresAt":"2026-09-13T09:00:00Z"}', x-error-response: '{"error":{"code":"TOKEN_EXPIRED","message":"Refresh token has expired.","details":{}},"traceId":"uuid"}', responses: { '200': { description: refreshed }, '401': { description: expired } } }
  /auth/logout:
    post: { operationId: logout, x-happy-response: '{"status":"LOGGED_OUT"}', x-error-response: '{"error":{"code":"TOKEN_EXPIRED","message":"Session is no longer valid.","details":{}},"traceId":"uuid"}', responses: { '200': { description: logged out }, '401': { description: expired } } }
  /auth/me:
    get: { operationId: getCurrentActor, x-happy-response: '{"id":"uuid","name":"Nguyen An","roles":["HR"],"teamIds":[]}', x-error-response: '{"error":{"code":"TOKEN_EXPIRED","message":"Access token has expired.","details":{}},"traceId":"uuid"}', responses: { '200': { description: actor }, '401': { description: expired } } }
  /dashboard:
    get: { operationId: getDashboard, x-happy-response: '{"stats":{"myBorrowCount":1},"todos":[{"referenceType":"TICKET","referenceId":"uuid"}],"emailNotificationEnabled":true}', x-error-response: '{"error":{"code":"ACCOUNT_INACTIVE","message":"Account is inactive.","details":{}},"traceId":"uuid"}', responses: { '200': { description: dashboard }, '403': { description: inactive } } }
  /assets:
    get: { operationId: listAssets, x-happy-response: '{"items":[{"id":"uuid","totalQuantity":5,"availableQuantity":3,"responsibleTeamId":null,"eligibleCustodies":[{"sourceCustodyId":"uuid","lendableQuantity":3}]}],"page":1,"pageSize":20,"total":1}', x-error-response: '{"error":{"code":"INVALID_QUERY","message":"page_size must not exceed 100.","details":{"field":"page_size"}},"traceId":"uuid"}', responses: { '200': { description: page }, '422': { description: invalid query } } }
  /assets/{asset_id}:
    get: { operationId: getAsset, x-happy-response: '{"id":"uuid","name":"Camera A","totalQuantity":5,"availableQuantity":3,"custodies":[]}', x-error-response: '{"error":{"code":"ASSET_NOT_FOUND","message":"Asset is not available.","details":{}},"traceId":"uuid"}', responses: { '200': { description: asset }, '404': { description: absent } } }
  /assets/held:
    get: { operationId: listHeldAssets, x-happy-response: '{"items":[{"custodyId":"uuid","assetId":"uuid","status":"PENDING","onHandQuantity":2}],"page":1,"pageSize":20,"total":1}', x-error-response: '{"error":{"code":"ACCOUNT_INACTIVE","message":"Account is inactive.","details":{}},"traceId":"uuid"}', responses: { '200': { description: page }, '403': { description: inactive } } }
  /custodies/{custody_id}/confirm:
    post: { operationId: confirmCustody, x-request: 'multipart/form-data: metadata plus 1..3 JPEG/PNG/WebP files <=10MB; Idempotency-Key', x-happy-response: '{"custodyId":"uuid","status":"ACTIVE","confirmedAt":"2026-09-13T02:00:00Z"}', x-error-response: '{"error":{"code":"CUSTODY_CONFIRMATION_FORBIDDEN","message":"Only assigned custodian may confirm.","details":{}},"traceId":"uuid"}', responses: { '200': { description: confirmed }, '403': { description: wrong actor } } }
  /tickets/borrow:
    post: { operationId: createBorrowTickets, x-request: 'JSON items[].allocations[] with assetId/sourceCustodyId/quantity/method/dueDate; Idempotency-Key', x-happy-response: '{"createdTickets":[{"id":"uuid","status":"PENDING"}],"rejectedGroups":[{"sourceCustodyId":"uuid","reasonCode":"INSUFFICIENT_LENDABLE_QUANTITY"}]}', x-error-response: '{"error":{"code":"IDEMPOTENCY_KEY_REUSED","message":"Key was used with a different request.","details":{}},"traceId":"uuid"}', responses: { '201': { description: partial group result }, '409': { description: key conflict } } }
  /tickets:
    get: { operationId: listTickets, x-happy-response: '{"items":[{"id":"uuid","status":"PENDING","method":"TEMPORARY","dueDate":"2026-10-15"}],"page":1,"pageSize":20,"total":1}', x-error-response: '{"error":{"code":"INVALID_QUERY","message":"perspective is invalid.","details":{}},"traceId":"uuid"}', responses: { '200': { description: page }, '422': { description: invalid filter } } }
  /tickets/{ticket_id}:
    get: { operationId: getTicket, x-happy-response: '{"id":"uuid","status":"APPROVED","items":[{"assetId":"uuid","sourceCustodyId":"uuid","quantity":2}],"events":[]}', x-error-response: '{"error":{"code":"TICKET_NOT_FOUND","message":"Ticket is not available.","details":{}},"traceId":"uuid"}', responses: { '200': { description: ticket }, '404': { description: absent } } }
  /tickets/{ticket_id}/approve:
    post: { operationId: approveTicket, x-happy-response: '{"id":"uuid","status":"APPROVED"}', x-error-response: '{"error":{"code":"TICKET_ACTION_FORBIDDEN","message":"Only source custodian may approve.","details":{}},"traceId":"uuid"}', responses: { '200': { description: approved }, '403': { description: wrong custodian } } }
  /tickets/{ticket_id}/reject:
    post: { operationId: rejectTicket, x-request: 'JSON {reason}; Idempotency-Key', x-happy-response: '{"id":"uuid","status":"REJECTED","releasedQuantity":2}', x-error-response: '{"error":{"code":"INVALID_TICKET_TRANSITION","message":"Only pending ticket can be rejected.","details":{}},"traceId":"uuid"}', responses: { '200': { description: rejected }, '409': { description: bad state } } }
  /tickets/{ticket_id}/confirm-received:
    post: { operationId: confirmTicketReceived, x-request: 'multipart/form-data evidence; Idempotency-Key', x-happy-response: '{"id":"uuid","status":"BORROWING"}', x-error-response: '{"error":{"code":"EVIDENCE_REQUIRED","message":"At least one image is required.","details":{}},"traceId":"uuid"}', responses: { '200': { description: received }, '422': { description: evidence absent } } }
  /tickets/{ticket_id}/mark-returned:
    post: { operationId: markTicketReturned, x-request: 'multipart/form-data evidence; Idempotency-Key', x-happy-response: '{"id":"uuid","status":"RETURNING"}', x-error-response: '{"error":{"code":"TICKET_ACTION_FORBIDDEN","message":"Only borrower may mark returned.","details":{}},"traceId":"uuid"}', responses: { '200': { description: marked returned }, '403': { description: wrong actor } } }
  /tickets/{ticket_id}/confirm-returned:
    post: { operationId: confirmTicketReturned, x-request: 'multipart/form-data evidence; Idempotency-Key', x-happy-response: '{"id":"uuid","status":"CLOSED","releasedQuantity":2}', x-error-response: '{"error":{"code":"INVALID_TICKET_TRANSITION","message":"Ticket must be RETURNING.","details":{}},"traceId":"uuid"}', responses: { '200': { description: closed }, '409': { description: bad state } } }
  /tickets/{ticket_id}/cancel-request:
    post: { operationId: requestTicketCancellation, x-request: 'JSON {reason}; Idempotency-Key', x-happy-response: '{"id":"uuid","status":"CANCELLED","releasedQuantity":2}', x-error-response: '{"error":{"code":"INVALID_TICKET_TRANSITION","message":"Ticket cannot be cancelled in current state.","details":{}},"traceId":"uuid"}', responses: { '200': { description: cancellation requested }, '409': { description: bad state } } }
  /tickets/{ticket_id}/cancel-resolve:
    post: { operationId: resolveTicketCancellation, x-request: 'JSON {approve:true}; Idempotency-Key', x-happy-response: '{"id":"uuid","status":"CANCELLED","releasedQuantity":2}', x-error-response: '{"error":{"code":"INVALID_TICKET_TRANSITION","message":"Ticket is not awaiting cancellation resolution.","details":{}},"traceId":"uuid"}', responses: { '200': { description: resolved }, '409': { description: bad state } } }
  /assets/{asset_id}/transactions:
    get: { operationId: listAssetTransactions, x-happy-response: '{"items":[{"id":"uuid","action":"TICKET_APPROVED","occurredAt":"2026-09-13T02:00:00Z"}],"page":1,"pageSize":20,"total":1}', x-error-response: '{"error":{"code":"ASSET_HISTORY_FORBIDDEN","message":"HR or asset-lead scope required.","details":{}},"traceId":"uuid"}', responses: { '200': { description: page }, '403': { description: denied } } }
  /hr/dashboard:
    get: { operationId: getHrDashboard, x-happy-response: '{"stats":{"totalAssets":12,"pendingCustodies":1},"todos":[]}', x-error-response: '{"error":{"code":"ROLE_REQUIRED","message":"HR role is required.","details":{}},"traceId":"uuid"}', responses: { '200': { description: dashboard }, '403': { description: denied } } }
  /hr/members:
    get: { operationId: listMembers, x-happy-response: '{"items":[{"id":"uuid","roles":["HR"],"email":"an@example.org"}],"page":1,"pageSize":20,"total":1}', x-error-response: '{"error":{"code":"ROLE_REQUIRED","message":"HR role is required.","details":{}},"traceId":"uuid"}', responses: { '200': { description: page }, '403': { description: denied } } }
  /hr/members/{member_id}/roles:
    put: { operationId: replaceMemberRoles, x-request: 'JSON {roles:["TEAM_HEAD"]}; SYSTEM_ADMIN required for HR/SYSTEM_ADMIN changes', x-happy-response: '{"id":"uuid","roles":["TEAM_HEAD"]}', x-error-response: '{"error":{"code":"ROLE_ASSIGNMENT_FORBIDDEN","message":"Elevated/self role change is forbidden.","details":{}},"traceId":"uuid"}', responses: { '200': { description: roles replaced }, '403': { description: denied } } }
  /hr/assets:
    get: { operationId: listHrAssets, x-happy-response: '{"items":[{"id":"uuid","responsibleTeamId":null}],"page":1,"pageSize":20,"total":1}', x-error-response: '{"error":{"code":"ROLE_REQUIRED","message":"HR role is required.","details":{}},"traceId":"uuid"}', responses: { '200': { description: page }, '403': { description: denied } } }
    post: { operationId: createAsset, x-request: 'JSON IDs only; Idempotency-Key', x-happy-response: '{"id":"uuid","totalQuantity":5,"availableQuantity":5,"pendingCustodyIds":["uuid"]}', x-error-response: '{"error":{"code":"ALLOCATION_QUANTITY_MISMATCH","message":"Custody allocation exceeds total quantity.","details":{}},"traceId":"uuid"}', responses: { '201': { description: created }, '422': { description: invalid allocation } } }
  /hr/assets/{asset_id}/responsible-team:
    patch: { operationId: updateResponsibleTeam, x-request: 'JSON {responsibleTeamId:"uuid"}; nullable, one team only', x-happy-response: '{"id":"uuid","responsibleTeamId":"uuid"}', x-error-response: '{"error":{"code":"TEAM_NOT_FOUND","message":"Responsible team is unavailable.","details":{}},"traceId":"uuid"}', responses: { '200': { description: updated }, '404': { description: team absent } } }
  /hr/assets/imports:
    post: { operationId: previewAssetImport, x-request: 'multipart/form-data template-conformant XLSX/CSV; Idempotency-Key', x-happy-response: '{"importId":"uuid","status":"PREVIEWED","validRowCount":2,"invalidRowCount":1,"rows":[{"rowNumber":2,"valid":true},{"rowNumber":3,"valid":false,"errors":["category is required"]}]}', x-error-response: '{"error":{"code":"UNSUPPORTED_IMPORT_FILE","message":"Upload a CSV or XLSX file.","details":{}},"traceId":"uuid"}', responses: { '200': { description: preview }, '422': { description: invalid file } } }
  /hr/assets/imports/{import_id}/confirm:
    post: { operationId: confirmAssetImport, x-request: 'Idempotency-Key; persists only valid rows from reviewed preview', x-happy-response: '{"importId":"uuid","status":"COMPLETED","importedAssetCount":2,"rejectedRows":[{"rowNumber":3,"errors":["category is required"]}]}', x-error-response: '{"error":{"code":"IMPORT_PREVIEW_EXPIRED","message":"Import preview is unavailable.","details":{}},"traceId":"uuid"}', responses: { '200': { description: imported }, '409': { description: preview unavailable } } }
  /hr/asset-transactions:
    get: { operationId: listHrAssetTransactions, x-happy-response: '{"items":[{"id":"uuid","assetId":"uuid","occurredAt":"2026-09-13T02:00:00Z"}],"page":1,"pageSize":20,"total":1}', x-error-response: '{"error":{"code":"INVALID_QUERY","message":"from must be before to.","details":{}},"traceId":"uuid"}', responses: { '200': { description: page }, '422': { description: invalid range } } }
  /teams/me/assets:
    get: { operationId: listMyTeamAssets, x-happy-response: '{"items":[{"id":"uuid","responsibleTeamId":"uuid"}],"page":1,"pageSize":20,"total":1}', x-error-response: '{"error":{"code":"TEAM_SCOPE_REQUIRED","message":"No assigned team scope is available.","details":{}},"traceId":"uuid"}', responses: { '200': { description: page }, '403': { description: denied } } }
  /reconciliations:
    post: { operationId: openReconciliation, x-request: 'JSON {reconciliationDate:"2026-10-20"}; Idempotency-Key', x-happy-response: '{"id":"uuid","reconciliationDate":"2026-10-20","status":"OPEN","temporaryLoanTicketCount":2}', x-error-response: '{"error":{"code":"INVALID_RECONCILIATION_DATE","message":"Date must be today or later.","details":{}},"traceId":"uuid"}', responses: { '201': { description: opened }, '422': { description: bad date } } }
  /reconciliations/{reconciliation_id}:
    get: { operationId: getReconciliation, x-happy-response: '{"id":"uuid","status":"OPEN","reconciliationDate":"2026-10-20","items":[]}', x-error-response: '{"error":{"code":"RECONCILIATION_NOT_FOUND","message":"Reconciliation is unavailable.","details":{}},"traceId":"uuid"}', responses: { '200': { description: reconciliation }, '404': { description: absent } } }
  /reconciliations/{reconciliation_id}/request-confirmation:
    post: { operationId: requestReconciliationConfirmation, x-request: 'Idempotency-Key', x-happy-response: '{"id":"uuid","requestedAt":"2026-09-13T02:00:00Z","emailRecipients":4}', x-error-response: '{"error":{"code":"INVALID_RECONCILIATION_TRANSITION","message":"Only an open reconciliation can request confirmation.","details":{}},"traceId":"uuid"}', responses: { '200': { description: emails queued }, '409': { description: bad state } } }
  /reconciliations/{reconciliation_id}/close:
    post: { operationId: closeReconciliation, x-request: 'Idempotency-Key', x-happy-response: '{"id":"uuid","status":"CLOSED","closedAt":"2026-10-20T10:00:00Z"}', x-error-response: '{"error":{"code":"RECONCILIATION_HAS_UNRESOLVED_ITEMS","message":"Resolve all discrepancies before closing.","details":{}},"traceId":"uuid"}', responses: { '200': { description: closed }, '409': { description: gated } } }
  /reconciliations/me:
    get: { operationId: listMyReconciliationItems, x-happy-response: '{"items":[{"id":"uuid","status":"PENDING_CONFIRMATION"}],"page":1,"pageSize":20,"total":1}', x-error-response: '{"error":{"code":"CUSTODIAN_SCOPE_REQUIRED","message":"No custody scope is available.","details":{}},"traceId":"uuid"}', responses: { '200': { description: page }, '403': { description: denied } } }
  /reconciliation-items/{item_id}/confirm:
    post: { operationId: confirmReconciliationItem, x-request: 'multipart evidence, condition enum and free-text note; Idempotency-Key', x-happy-response: '{"id":"uuid","status":"CONFIRMED","actualQuantity":2,"condition":"GOOD"}', x-error-response: '{"error":{"code":"RECONCILIATION_ITEM_FORBIDDEN","message":"Only assigned custodian may confirm.","details":{}},"traceId":"uuid"}', responses: { '200': { description: confirmed }, '403': { description: denied } } }
  /reconciliation-items/{item_id}/resolve:
    post: { operationId: resolveReconciliationItem, x-request: 'JSON {resolutionNote:"Counted again."}; Idempotency-Key', x-happy-response: '{"id":"uuid","status":"RESOLVED"}', x-error-response: '{"error":{"code":"ROLE_REQUIRED","message":"HR role is required.","details":{}},"traceId":"uuid"}', responses: { '200': { description: resolved }, '403': { description: denied } } }
  /reconciliation-items/{item_id}/remind:
    post: { operationId: remindReconciliationItem, x-request: 'Idempotency-Key', x-happy-response: '{"id":"uuid","emailQueued":true}', x-error-response: '{"error":{"code":"INVALID_RECONCILIATION_TRANSITION","message":"Item is already confirmed.","details":{}},"traceId":"uuid"}', responses: { '202': { description: queued }, '409': { description: bad state } } }
  /transfers:
    post: { operationId: createTransfer, x-request: 'JSON sourceCustodyId/targetUserId/quantity; Idempotency-Key', x-happy-response: '{"id":"uuid","status":"PENDING_BOTH_CONFIRMATIONS"}', x-error-response: '{"error":{"code":"TRANSFER_QUANTITY_INVALID","message":"Requested quantity exceeds source custody.","details":{}},"traceId":"uuid"}', responses: { '201': { description: created }, '409': { description: quantity conflict } } }
    get: { operationId: listTransfers, x-happy-response: '{"items":[{"id":"uuid","status":"PENDING_BOTH_CONFIRMATIONS"}],"page":1,"pageSize":20,"total":1}', x-error-response: '{"error":{"code":"INVALID_QUERY","message":"status is invalid.","details":{}},"traceId":"uuid"}', responses: { '200': { description: page }, '422': { description: invalid query } } }
  /transfers/{transfer_id}/confirm-current:
    post: { operationId: confirmTransferCurrent, x-request: 'multipart evidence; Idempotency-Key', x-happy-response: '{"id":"uuid","status":"PENDING_TARGET_CONFIRMATION"}', x-error-response: '{"error":{"code":"TRANSFER_CONFIRMATION_FORBIDDEN","message":"Only current custodian may confirm.","details":{}},"traceId":"uuid"}', responses: { '200': { description: confirmed }, '403': { description: denied } } }
  /transfers/{transfer_id}/confirm-target:
    post: { operationId: confirmTransferTarget, x-request: 'multipart evidence; Idempotency-Key; either side may confirm first', x-happy-response: '{"id":"uuid","status":"PENDING_CURRENT_CONFIRMATION"}', x-error-response: '{"error":{"code":"TRANSFER_CONFIRMATION_FORBIDDEN","message":"Only target custodian may confirm.","details":{}},"traceId":"uuid"}', responses: { '200': { description: confirmed or completed }, '403': { description: denied }, '409': { description: repeated confirmation } } }
  /reconciliation-items/{item_id}/transfer:
    post: { operationId: createReconciliationTransfer, x-request: 'JSON sourceCustodyId/targetUserId/quantity; Idempotency-Key', x-happy-response: '{"id":"uuid","reconciliationItemId":"uuid","status":"PENDING_BOTH_CONFIRMATIONS"}', x-error-response: '{"error":{"code":"TRANSFER_NOT_FOUND","message":"Reconciliation item is unavailable for this source Custody.","details":{}},"traceId":"uuid"}', responses: { '201': { description: created and linked }, '404': { description: unavailable item } } }
  /event-days:
    post: { operationId: createEventDay, x-request: 'JSON {name,eventDate,shifts:[{sequence,name,startsAt,endsAt,shiftLeadUserId,assets:[{assetId,quotaQuantity}]}]}; Idempotency-Key', x-happy-response: '{"id":"uuid","name":"Tet Booth","eventDate":"2030-01-02","status":"DRAFT","coreStockChanged":false,"createdByUserId":"uuid","shifts":[{"id":"uuid","sequence":1,"name":"Morning","startsAt":"2030-01-02T04:00:00Z","endsAt":"2030-01-02T05:00:00Z","shiftLeadUserId":"uuid","status":"SCHEDULED","assets":[{"assetId":"uuid","quotaQuantity":3,"carryOverQuantity":0,"expectedOpenQuantity":3}]}]}', x-error-response: '{"error":{"code":"EVENT_SCHEDULE_CONFLICT","message":"Event Day Shifts cannot overlap.","details":{}},"traceId":"uuid"}', responses: { '201': { description: created }, '409': { description: schedule conflict } } }
  /event-days/{event_day_id}:
    get: { operationId: getEventDay, x-happy-response: '{"id":"uuid","name":"Tet Booth","eventDate":"2030-01-02","status":"DRAFT","coreStockChanged":false,"createdByUserId":"uuid","shifts":[{"id":"uuid","sequence":1,"name":"Morning","startsAt":"2030-01-02T04:00:00Z","endsAt":"2030-01-02T05:00:00Z","shiftLeadUserId":"uuid","status":"SCHEDULED","assets":[{"assetId":"uuid","quotaQuantity":3,"carryOverQuantity":0,"expectedOpenQuantity":3}]}]}', x-error-response: '{"error":{"code":"EVENT_DAY_NOT_FOUND","message":"Event Day is unavailable.","details":{}},"traceId":"uuid"}', responses: { '200': { description: event configuration }, '404': { description: absent } } }
    patch: { operationId: updateEventDay, x-request: 'Complete JSON configuration; retained shifts include id; new shifts omit id; Idempotency-Key', x-happy-response: '{"id":"uuid","name":"Updated Event","eventDate":"2030-01-02","status":"DRAFT","coreStockChanged":false,"createdByUserId":"uuid","shifts":[{"id":"uuid","sequence":1,"name":"Morning","startsAt":"2030-01-02T05:00:00Z","endsAt":"2030-01-02T06:00:00Z","shiftLeadUserId":"uuid","status":"SCHEDULED","assets":[{"assetId":"uuid","quotaQuantity":3,"carryOverQuantity":0,"expectedOpenQuantity":3}]}]}', x-error-response: '{"error":{"code":"EVENT_SCHEDULE_CONFLICT","message":"An Event Day cannot change after a Shift begins.","details":{}},"traceId":"uuid"}', responses: { '200': { description: updated }, '409': { description: unsafe edit } } }
  /shifts:
    get: { operationId: listShifts, x-request: 'Query page/page_size; assigned active SHIFT_LEAD only', x-happy-response: '{"items":[{"id":"uuid","eventDayId":"uuid","eventDayName":"Tet Booth","sequence":1,"name":"Morning","startsAt":"2030-01-02T04:00:00Z","endsAt":"2030-01-02T05:00:00Z","shiftLeadUserId":"uuid","status":"SCHEDULED","coreStockChanged":false,"items":[{"id":"uuid","assetId":"uuid","quotaQuantity":3,"carryOverQuantity":0,"expectedOpenQuantity":3,"openingActualQuantity":null,"closingActualQuantity":null,"consumedQuantity":null,"discrepancyReason":null}]}],"page":1,"pageSize":20,"total":1}', x-error-response: '{"error":{"code":"SHIFT_ACTION_FORBIDDEN","message":"Active Shift Lead role is required.","details":{}},"traceId":"uuid"}', responses: { '200': { description: assigned Shift page }, '403': { description: denied } } }
  /shifts/{shift_id}:
    get: { operationId: getShift, x-happy-response: '{"id":"uuid","eventDayId":"uuid","eventDayName":"Tet Booth","sequence":1,"name":"Morning","startsAt":"2030-01-02T04:00:00Z","endsAt":"2030-01-02T05:00:00Z","shiftLeadUserId":"uuid","status":"OPENING","coreStockChanged":false,"items":[{"id":"uuid","assetId":"uuid","quotaQuantity":3,"carryOverQuantity":2,"expectedOpenQuantity":5,"openingActualQuantity":null,"closingActualQuantity":null,"consumedQuantity":null,"discrepancyReason":null}]}', x-error-response: '{"error":{"code":"SHIFT_NOT_FOUND","message":"Shift is unavailable.","details":{}},"traceId":"uuid"}', responses: { '200': { description: assigned Shift detail }, '404': { description: absent } } }
  /shifts/{shift_id}/open:
    post: { operationId: openShift, x-request: 'Idempotency-Key; no body; startsAt <= now < endsAt and predecessor CLOSED', x-happy-response: '{"id":"uuid","status":"OPENING","coreStockChanged":false,"items":[{"assetId":"uuid","quotaQuantity":3,"carryOverQuantity":2,"expectedOpenQuantity":5}]}', x-error-response: '{"error":{"code":"SHIFT_SCHEDULE_UNAVAILABLE","message":"The preceding Shift must close before this Shift opens.","details":{}},"traceId":"uuid"}', responses: { '200': { description: opening snapshot }, '409': { description: schedule or predecessor gate } } }
  /shifts/{shift_id}/confirm-received:
    post: { operationId: confirmShiftReceived, x-request: 'JSON {items:[{assetId,actualQuantity}]}; complete exact set; Idempotency-Key', x-happy-response: '{"id":"uuid","status":"ACTIVE","coreStockChanged":false,"items":[{"assetId":"uuid","expectedOpenQuantity":5,"openingActualQuantity":5}]}', x-error-response: '{"error":{"code":"SHIFT_QUANTITY_INVALID","message":"Exact opening quantities are required for normal confirmation.","details":{}},"traceId":"uuid"}', responses: { '200': { description: active }, '422': { description: mismatch or incomplete set } } }
  /shifts/{shift_id}/report-opening-deviation:
    post: { operationId: reportShiftOpeningDeviation, x-request: 'JSON {items:[{assetId,actualQuantity}],reason}; complete mismatching set; Idempotency-Key', x-happy-response: '{"id":"uuid","status":"ACTIVE_WITH_DEVIATION","coreStockChanged":false,"items":[{"assetId":"uuid","expectedOpenQuantity":5,"openingActualQuantity":4,"discrepancyReason":"One missing"}]}', x-error-response: '{"error":{"code":"SHIFT_QUANTITY_INVALID","message":"Opening deviation requires at least one mismatch.","details":{}},"traceId":"uuid"}', responses: { '200': { description: active with deviation and Teamlead email queued }, '422': { description: no mismatch or reason } } }
  /shifts/{shift_id}/close:
    post: { operationId: closeShift, x-request: 'JSON {items:[{assetId,actualQuantity}]}; complete non-negative closing set; Idempotency-Key', x-happy-response: '{"id":"uuid","status":"CLOSED","coreStockChanged":false,"items":[{"assetId":"uuid","expectedOpenQuantity":5,"closingActualQuantity":2,"consumedQuantity":3}]}', x-error-response: '{"error":{"code":"INVALID_SHIFT_TRANSITION","message":"Only an active Shift can be closed.","details":{}},"traceId":"uuid"}', responses: { '200': { description: closed with formula outputs }, '409': { description: bad state } } }
  /event-days/{event_day_id}/summary:
    get: { operationId: getEventDaySummary, x-happy-response: '{"eventDayId":"uuid","status":"COMPLETED","complete":true,"totalShiftCount":2,"closedShiftCount":2,"coreStockChanged":false,"items":[{"assetId":"uuid","totalQuotaQuantity":5,"totalConsumedQuantity":4,"openingVarianceQuantity":-1,"finalCarryOverQuantity":1}]}', x-error-response: '{"error":{"code":"SHIFT_ACTION_FORBIDDEN","message":"Asset Team Lead or HR role is required.","details":{}},"traceId":"uuid"}', responses: { '200': { description: progress; items null until complete }, '403': { description: denied } } }
  /handovers:
    post: { operationId: createHandover, x-request: 'JSON {termId:"uuid"}; Idempotency-Key', x-happy-response: '{"id":"uuid","status":"PENDING_CONFIRMATIONS"}', x-error-response: '{"error":{"code":"TERM_NOT_FOUND","message":"Term is unavailable.","details":{}},"traceId":"uuid"}', responses: { '201': { description: created }, '404': { description: absent } } }
  /handovers/{handover_id}:
