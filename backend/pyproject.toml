[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ams-backend"
version = "0.1.0"
description = "Asset Management System backend"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<1",
    "openpyxl>=3.1,<4",
    "pydantic-settings>=2.5,<3",
    "PyJWT>=2.7,<3",
    "python-multipart>=0.0.9,<1",
    "SQLAlchemy[asyncio]>=2.0,<3",
    "structlog>=24.4,<26",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "asyncpg-stubs>=0.30,<1",
    "black>=24.0,<26",
    "httpx>=0.27,<1",
    "mypy>=1.10,<2",
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<7",
    "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ams"]

[tool.black]
line-length = 96
target-version = ["py311"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ams"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "types-openpyxl>=3.1,<4",
]
