default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 44b5042edab9382aba712eed4f9c7bab7a3d6a3e # v0.17.0
    hooks:
      - id: ruff-check
        args: [--config=backend/pyproject.toml]
        files: ^backend/(src|tests)/.*\.py$

  - repo: https://github.com/psf/black
    rev: 782e5605c86aab56be6f905da10dcd3e463fd9c2 # 25.12.0
    hooks:
      - id: black
        args: [--config=backend/pyproject.toml]
        files: ^backend/(src|tests)/.*\.py$

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: frontend-tests
        name: frontend contract tests
        entry: npm --prefix frontend test
        language: system
        pass_filenames: false
        stages: [pre-push]
