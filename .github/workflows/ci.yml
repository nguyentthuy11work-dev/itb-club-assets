name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Run repository hooks
        run: uvx pre-commit run --all-files

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ams
          POSTGRES_USER: ams_app
          POSTGRES_PASSWORD: ams_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ams_app -d ams"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      AMS_DATABASE_URL: postgresql+asyncpg://ams_app:ams_ci@localhost:5432/ams
      AMS_JWT_SECRET: ci-only-secret-with-at-least-thirty-two-bytes
      AMS_JWT_ISSUER: ams-api
      AMS_JWT_AUDIENCE: ams-web
      AMS_REFRESH_COOKIE_SECURE: "false"

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Migrate database
        run: >-
          docker run --rm --network host
          -v "$PWD/backend/migrations:/flyway/sql:ro"
          flyway/flyway:13.7.0-alpine
          -url=jdbc:postgresql://localhost:5432/ams
          -user=ams_app
          -password=ams_ci
          -locations=filesystem:/flyway/sql
          -connectRetries=30
          migrate

      - name: Static analysis
        working-directory: backend
        run: |
          uv run black --check src tests
          uv run ruff check src tests
          uv run mypy src tests

      - name: Test backend
        working-directory: backend
        run: uv run pytest --junitxml=test-results.xml

      - name: Annotate backend test failures
        if: failure()
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("test-results.xml")
          if report.exists():
              root = ElementTree.parse(report).getroot()
              for case in root.iter("testcase"):
                  problem = case.find("failure")
                  if problem is None:
                      problem = case.find("error")
                  if problem is None:
                      continue
                  name = f"{case.get('classname', 'pytest')}.{case.get('name', 'test')}"
                  message = (problem.text or problem.get("message") or "Test failed").strip()
                  escaped = message[:4000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title={name}::{escaped}")
          PY

      - name: Enforce Domain/Application coverage
        working-directory: backend
        run: >-
          uv run pytest tests/unit tests/api
          --cov=src/ams/domain
          --cov=src/ams/application
          --cov-report=term-missing
          --cov-fail-under=100

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm test
          npm run build
          npm audit

  containers:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build
