name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ams
          POSTGRES_USER: ams_app
          POSTGRES_PASSWORD: ams_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ams_app -d ams"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      AMS_DATABASE_URL: postgresql+asyncpg://ams_app:ams_ci@localhost:5432/ams
      AMS_JWT_SECRET: ci-only-secret-with-at-least-thirty-two-bytes
      AMS_JWT_ISSUER: ams-api
      AMS_JWT_AUDIENCE: ams-web
      AMS_REFRESH_COOKIE_SECURE: "false"

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Migrate database
        run: >-
          docker run --rm --network host
          -v "$PWD/backend/migrations:/flyway/sql:ro"
          flyway/flyway:13.7.0-alpine
          -url=jdbc:postgresql://localhost:5432/ams
          -user=ams_app
          -password=ams_ci
          -locations=filesystem:/flyway/sql
          migrate

      - name: Static analysis
        working-directory: backend
        run: |
          uv run black --check src tests
          uv run ruff check src tests
          uv run mypy src tests

      - name: Test backend
        working-directory: backend
        run: uv run pytest

      - name: Enforce Domain/Application coverage
        working-directory: backend
        run: >-
          uv run pytest tests/unit tests/api
          --cov=src/ams/domain
          --cov=src/ams/application
          --cov-report=term-missing
          --cov-fail-under=100

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm test
          npm run build
          npm audit

  containers:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build
