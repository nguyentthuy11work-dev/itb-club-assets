name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
change-template: "- $TITLE (#$NUMBER) by @$AUTHOR"
change-title-escapes: "<*_&"
categories:
  - title: "🚀 Features"
    labels: [feature, enhancement]
  - title: "🐛 Fixes"
    labels: [bug, fix]
  - title: "🔐 Security"
    labels: [security]
  - title: "🧰 Maintenance"
    labels: [dependencies, maintenance, ci]
exclude-labels: [skip-changelog]
version-resolver:
  major:
    labels: [major, breaking]
  minor:
    labels: [minor, feature, enhancement]
  patch:
    labels: [patch, bug, fix, dependencies]
  default: patch
template: |
  ## What's changed

  $CHANGES

  **Full changelog:** $PREVIOUS_TAG...v$RESOLVED_VERSION
